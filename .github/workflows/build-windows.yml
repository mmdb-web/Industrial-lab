name: Build Industrial Lab (Windows VST3)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Compile
        run: cmake --build build --config Release --target IndustrialLab_VST3 --parallel 2
      - name: Locate compiled VST3
        shell: pwsh
        run: |
          $vst = Get-ChildItem -Path build -Recurse -Directory -Filter 'Industrial Lab.vst3' | Select-Object -First 1
          if (-not $vst) { throw 'VST3 bundle not found' }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -LiteralPath $vst.FullName -Destination package -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: IndustrialLab-Windows-VST3
          path: package/
          if-no-files-found: error
